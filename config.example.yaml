# Copia este fichero como config.yaml y ajústalo a vuestro negocio.
# config.yaml NO debe subirse a GitHub con contraseñas reales dentro:
# usad variables de entorno / GitHub Secrets (ver README.md).

# Solo interesa PRODUCCIÓN / SUMINISTRO de material para carreras y bolsas del
# corredor, con margen de producción suficiente. El script funciona en tres pasos:
#   1) buscar estas frases en el buscador documental de PLACSP (descubrimiento);
#   2) quedarse solo con contratos del tipo indicado cuyo título/CPV contenga
#      algún término de carrera y ninguna exclusión;
#   3) leer los pliegos en PDF y descartar los que fijen un plazo de entrega
#      menor que plazo_entrega_minimo_dias.
incluir_palabras_clave:
  - "bolsa del corredor"
  - "bolsas del corredor"
  - "carrera popular"
  - "carreras populares"
  - "prueba deportiva"
  - "pruebas deportivas"
  - "prueba atlética"
  - "dorsales"
  - "medallas finisher"
  - "trofeos deportivos"
  - "camisetas técnicas"
  - "calcetines técnicos"
  - "material deportivo"
  - "eventos deportivos"
  - "maratón"
  - "media maratón"
  - "trail running"
  - "carrera solidaria"
  - "carrera nocturna"
  - "cursa popular"

# Tipos de contrato que se avisan (campo "Tipo de Contrato" de la ficha).
# "Suministros" = fabricar/comprar material; "Servicios" (organización,
# cronometraje, ambulancias...) queda fuera.
tipos_contrato:
  - "Suministros"

# Para avisar, el título (o los CPV) debe contener alguno de estos términos
# relacionados con carreras o con el material típico de una carrera.
terminos_carrera:
  - "carrera"
  - "corredor"
  - "dorsal"
  - "maratón"
  - "maraton"
  - "trail"
  - "running"
  - "finisher"
  - "san silvestre"
  - "atlétic"
  - "atletic"
  - "cursa popular"
  - "medalla"
  - "trofeo"
  - "10k"
  - "5k"

# Si el título o los CPV contienen cualquiera de estas frases, se descarta SIEMPRE.
excluir_palabras_clave:
  - "mantenimiento de instalaciones deportivas"
  - "limpieza de piscina"
  - "monitor de gimnasio"
  - "socorrista"
  - "socorrismo"
  - "césped artificial"
  - "climatización pabellón"
  - "gimnasio"
  - "fitness"
  - "crossfit"
  - "pabellón"
  - "polideportivo"
  - "sala de recuperación"
  - "buques"
  - "ambulancia"
  - "espectáculo taurino"
  - "espectaculos taurinos"
  - "corrida de toros"
  - "suelta de vaquillas"
  - "rejoneo"
  - "encierro"

# Plazo de entrega según el pliego (en días):
#  - menor que plazo_entrega_minimo_dias  -> NO se avisa (queda en "Descartadas").
#  - entre mínimo y plazo_entrega_comodo_dias -> se avisa marcado como "plazo
#    ajustado" para que valoréis si se puede gestionar.
#  - mayor o igual que comodo -> se avisa sin marca.
# Si el plazo no se detecta en el pliego, se avisa indicando "revisar a mano".
plazo_entrega_minimo_dias: 30
plazo_entrega_comodo_dias: 90

email:
  usuario: "tuempresa@gmail.com"
  password: ""            # mejor dejarlo vacío aquí y usar EMAIL_PASSWORD (ver README)
  destinatario: "tuempresa@gmail.com"
  smtp_servidor: "smtp.gmail.com"
  smtp_puerto: 587

telegram:
  bot_token: ""            # mejor usar TELEGRAM_BOT_TOKEN (ver README)
  chat_id: ""               # mejor usar TELEGRAM_CHAT_ID (ver README)
