# Copia este fichero como config.yaml y ajústalo a vuestro negocio.
# config.yaml NO debe subirse a GitHub con contraseñas reales dentro:
# usad variables de entorno / GitHub Secrets (ver README.md).

# Cada una de estas frases se busca tal cual (búsqueda exacta) en el buscador
# documental de PLACSP, que indexa el texto completo de anuncios y pliegos —
# no solo el título — así que encuentra muchas más licitaciones reales que
# filtrar por CPV o por el feed de "novedades".
incluir_palabras_clave:
  - "bolsa del corredor"
  - "bolsas del corredor"
  - "carrera popular"
  - "carreras populares"
  - "prueba deportiva"
  - "pruebas deportivas"
  - "dorsales"
  - "cronometraje"
  - "avituallamiento"
  - "trofeos deportivos"
  - "medallas finisher"
  - "material deportivo"
  - "equipamiento deportivo"
  - "eventos deportivos"
  - "organización de eventos deportivos"
  - "organización de la prueba"
  - "prueba atlética"
  - "maratón"
  - "media maratón"
  - "trail running"
  - "carrera solidaria"
  - "carrera nocturna"

# Si el título o la descripción contiene cualquiera de estas frases,
# se descarta SIEMPRE, aunque también matchee una palabra clave de arriba.
excluir_palabras_clave:
  - "mantenimiento de instalaciones deportivas"
  - "limpieza de piscina"
  - "monitor de gimnasio"
  - "socorrista"
  - "césped artificial"
  - "climatización pabellón"
  - "vigilancia y socorrismo"
  - "espectáculo taurino"
  - "espectaculos taurinos"
  - "corrida de toros"
  - "suelta de vaquillas"
  - "rejoneo"
  - "encierro"

