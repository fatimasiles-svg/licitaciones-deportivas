# CPV de referencia. OJO: en pruebas reales, los CPV "paraguas" de deporte/cultura
# (ej. 92000000) devuelven MUCHO ruido (toros, patrocinios, ferias...) porque son
# categorías muy amplias — el mismo problema que las alertas oficiales de PLACSP.
# Por eso vienen desactivados por defecto (lista vacía) y el filtrado se basa solo
# en incluir_palabras_clave, que en la práctica da resultados mucho más limpios.
# Actívalos solo si os interesa ampliar la red y estáis dispuestos a filtrar ruido
# a mano; los más específicos son los que menos falsos positivos dan:
#   37400000 Artículos y equipo deportivo
#   92620000 Servicios relacionados con el deporte
#   79952000 Servicios de eventos
#   92000000 Servicios de esparcimiento, culturales y deportivos (MUY amplio, no recomendado)
